<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Monaco, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#1e1633"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d4d"/>
      <stop offset="1" stop-color="#c27aff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#31344b" stroke-width="2"/>

  <!-- terminal window -->
  <rect x="80" y="96" width="560" height="300" rx="12" fill="#0b0d13" stroke="#31344b" stroke-width="2"/>
  <circle cx="114" cy="130" r="8" fill="#ff5f57"/>
  <circle cx="140" cy="130" r="8" fill="#febc2e"/>
  <circle cx="166" cy="130" r="8" fill="#28c840"/>
  <text x="104" y="184" font-size="24" fill="#7ee787">$ docker compose up -d</text>
  <text x="104" y="224" font-size="24" fill="#9da4b8">LocalStack ready → localhost:4566</text>
  <text x="104" y="264" font-size="24" fill="#7ee787">$ aws s3 mb s3://demo</text>
  <text x="104" y="304" font-size="24" fill="#9da4b8">make_bucket: demo</text>
  <text x="104" y="344" font-size="28" fill="#c27aff">$ <tspan fill="#e6e9f2">_</tspan></text>

  <!-- title -->
  <text x="690" y="200" font-size="58" font-weight="bold" fill="#e6e9f2">AWS with</text>
  <text x="690" y="278" font-size="58" font-weight="bold" fill="url(#accent)">LocalStack</text>
  <text x="690" y="338" font-size="26" fill="#9da4b8">Learn AWS for free —</text>
  <text x="690" y="376" font-size="26" fill="#9da4b8">real APIs, zero costs.</text>

  <!-- footer strip -->
  <rect x="80" y="460" width="1040" height="2" fill="url(#accent)"/>
  <text x="80" y="520" font-size="24" fill="#9da4b8">S3 · SQS · DynamoDB · Lambda · IAM — with Docker Compose</text>
  <text x="80" y="562" font-size="22" fill="#5b6178">aws-with-localstack.vercel.app</text>
</svg>
